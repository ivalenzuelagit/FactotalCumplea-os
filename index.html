<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tarjeta de cumpleaños interactiva de Factotal. Globos, torta y velas animadas." />
    <title>Cumpleaños Feliz · Factotal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="bg-wash" aria-hidden="true"></div>
      <canvas id="confetti" class="confetti-layer" aria-hidden="true"></canvas>
      <div class="sparkles" aria-hidden="true"></div>

      <header class="brand">
        <div class="logo" aria-hidden="true">
          <span class="logo-mark">Ft</span>
        </div>
        <span class="logo-word">FACTOTAL</span>
      </header>

      <section class="balloons" id="balloons" aria-label="Globos interactivos"></section>

      <main class="card">
        <p class="eyebrow">Una celebración especial</p>
        <h1 class="title">
          <span class="title-script">Cumpleaños</span>
          <span class="title-serif" id="birthdayTitle">Feliz</span>
        </h1>
        <div class="gold-rule" aria-hidden="true"></div>
        <p class="wish" id="wish">
          ¡Te deseamos un día increíble, que hoy y el año que se viene te traiga
          éxitos, alegrías y muchos más!
        </p>
        <p class="hint">Toca los globos, sopla las velas y pide un deseo.</p>
      </main>

      <section class="cake-stage" aria-label="Torta de cumpleaños">
        <div class="cake" id="cake">
          <div class="candles" id="candles"></div>
          <div class="cake-top">
            <div class="icing"></div>
            <div class="drip drip-1"></div>
            <div class="drip drip-2"></div>
            <div class="drip drip-3"></div>
            <div class="drip drip-4"></div>
            <div class="drip drip-5"></div>
          </div>
          <div class="layer layer-top"></div>
          <div class="cream cream-top"></div>
          <div class="layer layer-mid"></div>
          <div class="cream cream-mid"></div>
          <div class="layer layer-base"></div>
          <div class="board"></div>
          <div class="plate"></div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="blowBtn" type="button">
            Soplar las velas
          </button>
          <button class="btn btn-ghost" id="relightBtn" type="button">
            Encender de nuevo
          </button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </div>

    <div class="wish-toast" id="toast" role="dialog" aria-live="assertive" hidden>
      <p>¡Que se cumpla tu deseo!</p>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
